; PlatformIO Configuration for FLOAT32 Test Harness
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_port = /dev/ttyACM0

; Build configuration
build_type = debug
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DTF_LITE_STATIC_MEMORY
    -DTF_LITE_DISABLE_X86_NEON
    -DTENSOR_ARENA_SIZE=262144
    -Os
    -g
    -I ~/.platformio/packages/framework-arduinoespressif32-esp32-libs/include/espressif__esp-tflite-micro

; U8g2 library
lib_deps = 
    olikraus/U8g2@^2.35.15

; Increase upload speed
upload_speed = 921600

; Use default 4MB partition table (not 16MB)
board_build.partitions = default.csv