; TinyDiffusion-ESP32 PlatformIO Configuration
; Target: ESP32 DevKit V1 (ESP32-WROOM-32)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build flags - combined into single declaration for PlatformIO 6.x compatibility
build_flags = 
  -DCORE_DEBUG_LEVEL=0
  -Os
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections
  -DTFLITE_MICRO_DEBUG_LOG=0
  -DTFLITE_MICRO_ENABLED=1
  -DESP_NN_ENABLED=1
  -DMODEL_INPUT_HEIGHT=28
  -DMODEL_INPUT_WIDTH=28
  -DMODEL_INPUT_CHANNELS=12
  -DMODEL_OUTPUT_CHANNELS=1
  -DDEFAULT_SAMPLING_STEPS=8
  -DDISPLAY_WIDTH=128
  -DDISPLAY_HEIGHT=64
  -DDISPLAY_I2C_ADDR=0x3C
  -DDISPLAY_SDA_PIN=21
  -DDISPLAY_SCL_PIN=22
  -DDISPLAY_SCALE_FACTOR=2

; Library dependencies
lib_deps = 
  ; U8g2 for OLED display
  olikraus/U8g2@^2.35.15
  
  ; TensorFlow Lite Micro (included in ESP-IDF)
  ; We'll use the ESP-IDF component

; Board specific settings
board_build.flash_mode = dio
board_build.f_cpu = 240000000L

; Memory optimization
build_unflags = 
  -Werror=unused-variable
  -Werror=unused-function

; Custom upload protocol if needed
; upload_protocol = esptool

[env:esp32dev_debug]
extends = env:esp32dev
build_type = debug
build_flags = 
  -DCORE_DEBUG_LEVEL=3
  -O0
  -g3

[platformio]
default_envs = esp32dev